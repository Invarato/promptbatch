[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promptbatch"
version = "0.1.0"
description = "Lanza un prompt (una «tarea») sobre muchos ficheros con la API de Anthropic, en directo o en lote (Batch API, a mitad de precio)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["anthropic>=1.0"]

[project.optional-dependencies]
dev = ["pytest"]
mcp = ["mcp>=2.3"]

[project.scripts]
promptbatch = "promptbatch.cli:main"
promptbatch-mcp = "promptbatch.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
